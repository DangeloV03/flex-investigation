# Static Slurm directives for the coex dispatcher (simple_slurm).
# Edit partition, account, and resources for your Della setup.

job_name: flex_sim
cpus_per_task: 4
mem: 8G
time: "24:00:00"
partition: cpu
# account: your_account   # uncomment if required
# Logs go under the output root (on /scratch, large quota), keeping SLURM
# stdout/err off the small /home quota — writing logs to /home fills it and
# every job dies with "OSError: [Errno 122] Disk quota exceeded" at its first
# print(). Relative paths resolve to the sbatch submit dir (the output root).
report_dir: slurm_reports
output: "slurm_reports/%j.out"
error: "slurm_reports/%j.err"

# Shell commands prepended to each batch script (module loads, conda activate, etc.)
setup_cmds:
  - "module load anaconda3/2024.10"
  - "source \"$(conda info --base)/etc/profile.d/conda.sh\""
  - "conda activate lattice"
  - "export LD_LIBRARY_PATH=\"$CONDA_PREFIX/lib:${LD_LIBRARY_PATH:-}\""
  - "export PYTHONUNBUFFERED=1"
